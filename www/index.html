<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker Brasil</title>  

  <!-- SEO -->  
  <meta name="theme-color" content="#FBF0C1">
  <meta name="robots" content="index, follow">
  <meta name="description" content="Cookie Clicker Brasil - Looking for a new game to play with your friends? Play now!">
  <meta name="description" lang="pt-BR" content="Cookie Clicker Brasil - Procurando um jogo novo para jogar com seus amigos?">
  <meta name="keywords" content="Cookie Clicker, Game, Brasil, "> 
  
  <!-- Author --->
  <meta name="author" content="Sebastian Jn <sebastianjnuwu@gmail.com>" />
  
  <!-- Open Graph -->  
  <meta property="og:site_name" content="Cookie Clicker Brasil">
  <meta property="og:title" content="Cookie Clicker Brasil">
  <meta property="og:description" content="Cookie Clicker Brasil - Procurando um jogo novo para jogar com seus amigos? Jogue agora!">
  <meta property="og:description" lang="en" content="Cookie Clicker Brasil - Looking for a new game to play with your friends? Play now!">
  <meta property="og:image" content="https://cookie-clicker-brasil.vercel.app/favicon.ico">
  <meta property="og:url" content="https://cookie-clicker-brasil.vercel.app/">
  <meta property="og:locale" content="en">
  <meta property="og:locale:alternate" content="pt-BR" />
  <meta property="og:type" content="website">  
  
  <!-- Links and Scripts -->  
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="https://cookie-clicker-brasil.vercel.app">
  
  <!-- Favicon -->
  <link rel="shortcut icon" href="https://cookie-clicker-brasil.vercel.app/favicon.ico" type="image/webp">
  <link rel="apple-touch-icon" href="https://cookie-clicker-brasil.vercel.app/favicon.ico">  
  
  <!-- Fonts -->  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=MedievalSharp&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
  
  <!-- Styles --> 
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet"> 
  
  <!-- Ads -->
  <meta name="google-adsense-account" content="ca-pub-6690516270288705">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6690516270288705" crossorigin="anonymous"></script>  
  
  <script type="module" src="./main.ts"></script>
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100">

 <div id="overlay"></div>
 
 <!--- PRIVACY POLICY AND TERMS OF USE NOTICE MESSAGE --->
 <cookie id='cookie'>
  <div class='content'>
    <p><i18next i18next-id="cookie.message"></i18next></p>
    <div class="row mt-2">
      <div class="col">
        <button class="btn btn-outline-light w-100" id="reject-cookies">
          <i class="fas fa-times-circle"></i> <i18next i18next-id="cookie.reject"></i18next>
        </button>
      </div>
      <div class="col">
        <button class="btn btn-warning w-100" id="accept-cookies">
          <i class="fas fa-cookie-bite"></i> <i18next i18next-id="cookie.accept"></i18next>
        </button>
      </div>
    </div>
  </div>
 </cookie>

 <!--- POPUP MESSAGE --->
 <div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="message"></div>
 </div>

 <!-- SCREEN OF WHEN A NEW UPDATE IS AVAILABLE IN THE ANDROID APPLICATION --->
 <div id="update-screen" style="display: none;">
  <div class="update-content">
    <h1><i18next i18next-id="update.title">New version available!</i18next></h1>
    <a class="update-btn">
      <i class="fas fa-download"></i> <i18next i18next-id="update.download">Download</i18next>
    </a>
  </div>
</div>

 <!--- SPLASH SCREEN --->
 <div id="splash-screen">
    <img class="icon" src="https://cookie-clicker-brasil.vercel.app/favicon.ico" />
  <div class="splash-footer">
    <i18next i18next-id="splashScreen.policy"><a target='_blank' data-bs-toggle='modal' data-bs-target='#terms_modal'>Terms of Use</a> and <a target='_blank' data-bs-toggle='modal' data-bs-target='#policy_modal'>Privacy Policy</a></i18next>
  </div>
  </div>

 <!-- THE GAME'S START MENU  --->
 <div id="start-screen" style="display: none;">
        <h1 class="title">
            <i class="fas fa-cookie-bite"></i>
            <i18next i18next-id="menu.cookieTitle">Cookie</i18next>
        </h1>
        <div class="menu">
            <button id="start-playing" data-bs-toggle="modal" data-bs-target="#room_modal">
                <i class="fas fa-gamepad"></i>
                <i18next i18next-id="menu.playButton">Play</i18next>
            </button>
          <!---  <button id="start-statistics" data-bs-toggle="modal" data-bs-target="#statistics_modal">
                <i class="fas fa-chart-bar"></i>
                <i18next i18next-id="menu.statistics">Statistics</i18next>
            </button>
            <button id="start-shop" data-bs-toggle="modal" data-bs-target="#shop_modal">
                <i class="fas fa-store"></i>
                <i18next i18next-id="menu.shop">Shop</i18next>
            </button> -->
            <button id="start-settings" data-bs-toggle="modal" data-bs-target="#settings_modal">
                <i class="fas fa-cog"></i>
                <i18next i18next-id="menu.settings">Settings</i18next>
            </button> 
        </div>
    </div>

 <!-- COUNTDOWN --->
 <div style="display: none;" id="countdown-container" class="countdown-overlay justify-content-center align-items-center">
   <h1 id="countdown" class="countdown-text">3</h1>
 </div>

 <!-- GAME SCREEN WHEN YOU CLICK ON THE COOKIE  --->
 <ui style="display: none;">

        <div id="ranking" style="display: none;">
            <h2>
                <i class="fas fa-trophy"></i>
                <i18next i18next-id="ranking.rankingTitle">Ranking</i18next>
            </h2>
            <ul id="ranking-list"></ul>
            <div class="d-flex flex-column justify-content-center align-items-center gap-2">
                <button id="game_exit" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i>
                    <i18next i18next-id="ranking.leaveButton">Exit</i18next>
                </button>
            </div>
        </div>

        <div class="room-code position-fixed top-0 start-50 translate-middle-x mt-4">
            <h3>
                <i class="fas fa-key"></i>
                <i18next i18next-id="ranking.roomCode">Room Code:</i18next>
            </h3>
            <p id="current_code">
                <i class="fas fa-wifi"></i>
            </p>
        </div>

    <div class="waiting-room">
            <div class="waiting-room-data">
                <h1>
                    <i class="fas fa-cookie-bite"></i>
                    <i18next i18next-id="ranking.waiting">Waiting...</i18next>
                </h1>
                <p>
                    <i class="fas fa-users"></i>
                    <x id="online">1</x>/<x id="max">10</x>
                </p>
                <div class="d-flex flex-column justify-content-center align-items-center gap-2">
                    <button id="start_game" class="btn btn-primary">
                        <i class="fas fa-play"></i>
                        <i18next i18next-id="ranking.startButton">Start</i18next>
                    </button>
                    <button id="leave_room" class="btn btn-secondary">
                        <i class="fas fa-sign-out-alt"></i>
                        <i18next i18next-id="ranking.leaveButton">Leave</i18next>
                    </button>
                </div>
            </div>
        </div>

        <div id="game" style="display: none;">
            <table class="d-flex flex-column justify-content-center align-items-center statistic position-relative">
                <tbody>
                    <tr>
                        <th>
                            <i class="fas fa-cookie-bite"></i>
                            <i18next i18next-id="general.cookies">Cookies</i18next>
                        </th>
                        <td id="click-cookie" class="value">0</td>
                    </tr>
                    <tr>
                        <th>
                            <i class="fas fa-stopwatch"></i>
                            <i18next i18next-id="general.seconds">Seconds</i18next>
                        </th>
                        <td id="cps" class="value">0</td>
                    </tr>
                </tbody>
            </table>
            <cookie class="d-flex flex-column justify-content-center align-items-center cookie position-relative">
                <img src="https://cookie-clicker-brasil.vercel.app/images/cookie/cookie-default.webp" oncontextmenu="return false;" alt="cookie default" class="icon mb-4">
            </cookie>
            <div class="game-time position-fixed bottom-0 start-50 translate-middle-x mb-4">
                <h3>
                    <i class="fas fa-stopwatch"></i>
                    <i18next i18next-id="general.timeLabel">Time:</i18next>
                    <span id="timer">0:00</span>
                </h3>
            </div>
        </div>

    </ui>

 <!--- MULTIPLAYER ROOM SETTINGS CARD --->
 <div class="modal fade" id="room_modal" tabindex="-1" aria-labelledby="room_modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="room_modalLabel">
                        <i class="fas fa-gamepad"></i>
                        <i18next i18next-id="menu.settings">Settings</i18next>
                    </h5>
                </div>
                <div class="modal-body">
                    <form id="form">
                        <div class="mb-3">
                            <label for="nickname" class="form-label">
                                <i class="fas fa-user"></i>
                                <i18next i18next-id="game.nicknameLabel">Nickname</i18next>
                            </label>
                            <input type="text" class="form-control" id="room_name" name="nickname"
                                placeholder="Scooby-Doo" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-list-ul"></i>
                                <i18next i18next-id="game.gameOptionLabel">Choose an option:</i18next>
                            </label>
                            <div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="option_game" id="room_random"
                                        value="room_random">
                                    <label class="form-check-label" for="room_random">
                                        <i class="fas fa-random"></i>
                                        <i18next i18next-id="game.randomRoom">Join a random room</i18next>
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="option_game" id="createRoom"
                                        value="create" checked>
                                    <label class="form-check-label" for="createRoom">
                                        <i class="fas fa-plus-circle"></i>
                                        <i18next i18next-id="game.createRoom">Create a room</i18next>
                                    </label>
                                </div>



                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="option_game" id="room_join"
                                        value="join">
                                    <label class="form-check-label" for="room_join">
                                        <i class="fas fa-sign-in-alt"></i>
                                        <i18next i18next-id="game.joinRoom">Join a room</i18next>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3" id="code_container" style="display: none;">
                            <label for="room_code" class="form-label">
                                <i class="fas fa-key"></i>
                                <i18next i18next-id="game.roomCodeLabel">Room Code</i18next>
                            </label>
                            <input type="text" class="form-control" id="room_code" name="room_code"
                                placeholder="XN4ZXP" autocomplete="off">
                        </div>


                        <div id="game_container">

                            <div class="d-flex gap-2">
                                <div class="mb-3 flex-grow-1">
                                    <label for="room_time" class="form-label d-block">
                                        <i class="fas fa-clock"></i>
                                        <i18next i18next-id="game.gameTimeLabel">Game Time</i18next>
                                    </label>
                                    <input type="number" class="form-control w-100" id="room_time" name="gameTime"
                                        placeholder="e.g. 11" min="11" max="600" value="11">
                                </div>
                                <div class="mb-3 flex-grow-1">
                                    <label for="player_limit" class="form-label d-block">
                                        <i class="fas fa-users"></i>
                                        <i18next i18next-id="game.gamePlayerLimit">Player Limit</i18next>
                                    </label>
                                    <input type="number" class="form-control w-100" id="player_limit" name="playerLimit"
                                        placeholder="e.g. 10" min="2" max="50" value="10">
                                </div>
                            </div>



                            <div class="mb-3">
                                <label for="publicRoom" class="form-label">
                                    <i class="fas fa-users"></i>
                                    <i18next i18next-id="game.publicRoomLabel">Public Room</i18next>
                                </label>
                                <input type="checkbox" class="form-check-input me-2" id="room_public"
                                    name="room_public">
                            </div>


                        </div>


                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="close" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i>
                        <i18next i18next-id="modal.cancel">Cancel</i18next>
                    </button>
                    <button id="form_button" class="confirm">
                        <i class="fas fa-check"></i>
                        <i18next i18next-id="modal.confirm">Confirm</i18next>
                    </button>
                </div>
            </div>
        </div>
    </div>

 <!-- CARD TO CONFIGURE GAME  --->
 <div class="modal fade" id="settings_modal" tabindex="-1" aria-labelledby="settings_modalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="settings_modalLabel">
          <i class="fas fa-cog me-2"></i>
          <i18next i18next-id="menu.settings">Configurações</i18next>
        </h5>

      </div>
      <div class="modal-body">
        <form id="settings-form" class="d-flex flex-column gap-2">
          
          <div class="d-flex justify-content-between align-items-center">
            <div class="mb-2">
  <label for="toggleSound" class="form-label">
    <i class="fas fa-volume-up"></i>
    <i18next i18next-id="settings.sound">Sound</i18next>
  </label>
  <input type="checkbox" class="form-check-input me-2" id="toggleSound" name="toggleSound">
</div>
          </div>

          <div class="d-flex justify-content-between align-items-center">
          <div class="mb-2">
  <label for="toggleMusic" class="form-label">
    <i class="fas fa-music"></i>
    <i18next i18next-id="settings.music">Background Music</i18next>
  </label>
  <input type="checkbox" class="form-check-input me-2" id="toggleMusic" name="toggleMusic">
</div>
          </div>
          
        </form>
      </div>
                <div class="modal-footer">
                    <button type="button" class="close" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i>
                        <i18next i18next-id="modal.cancel">Cancel</i18next>
                    </button>
                </div>
    </div>
  </div>
</div>

 <!--- CARD TO PRESENT THE TERMS TO USERS FOLLOWING THE CORRECT POLICIES --->
 <div class="modal fade" id="terms_modal" tabindex="-1" aria-labelledby="terms_modalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
   <div class="modal-header">
        <h5 class="modal-title" id="settings_modalLabel">
          <i class="fas fa-file-signature me-2"></i>
          <i18next i18next-id="terms.title">Terms</i18next>
        </h5>
      </div>
   <div class="modal-body">
   <div class="block">
     <p>x</p>
   </div>
   </div>
   <div class="modal-footer">
      <button type="button" class="close" data-bs-dismiss="modal">
   <i class="fas fa-times"></i>
   <i18next i18next-id="modal.cancel">Cancel</i18next>
      </button>
     </div>
    </div>
   </div>
  </div>

 <!-- CARD FOR PLAYERS TO ACCEPT/DECLINE THE PRIVACY POLICIES EMPLOYED BY OUR GAME - POLITICALLY CORRECT!  --->
 <div class="modal fade" id="policy_modal" tabindex="-1" aria-labelledby="policy_modalLabel" aria-hidden="true">
  <div class="modal-dialog">
   <div class="modal-content">
     <div class="modal-header">
       <h5 class="modal-title" id="settings_modalLabel">
          <i class="fas fa-user-secret me-2"></i> <i18next i18next-id="policy.title">Policy</i18next>
        </h5>
      </div>
     <div class="modal-body">
       <div class="block">
        <p>x</p>
       </div>
      </div>
     <div class="modal-footer">
      <button type="button" class="close" data-bs-dismiss="modal">
         <i class="fas fa-times"></i>
         <i18next i18next-id="modal.cancel">Cancel</i18next>
      </button>
    </div>
   </div>
  </div>
 </div>

 </body>
</html>
