<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker Brasil</title>  

  <!-- SEO -->  
  <meta name="theme-color" content="#FBF0C1">
  <meta name="robots" content="index, follow">
  <meta name="description" content="Cookie Clicker Brasil - Looking for a new game to play with your friends? Play now!">
  <meta name="description" lang="pt-BR" content="Cookie Clicker Brasil - Procurando um jogo novo para jogar com seus amigos?">
  <meta name="keywords" content="Cookie Clicker, Game, Brasil, "> 
  
  <!-- Author --->
  <meta name="author" content="Sebastian Jn <sebastianjnuwu@gmail.com>" />
  
  <!-- Open Graph -->  
  <meta property="og:site_name" content="Cookie Clicker Brasil">
  <meta property="og:title" content="Cookie Clicker Brasil">
  <meta property="og:description" content="Cookie Clicker Brasil - Procurando um jogo novo para jogar com seus amigos? Jogue agora!">
  <meta property="og:description" lang="en" content="Cookie Clicker Brasil - Looking for a new game to play with your friends? Play now!">
  <meta property="og:image" content="https://cookie-clicker-brasil.vercel.app/favicon.ico">
  <meta property="og:url" content="https://cookie-clicker-brasil.vercel.app/">
  <meta property="og:locale" content="en">
  <meta property="og:locale:alternate" content="pt-BR" />
  <meta property="og:type" content="website">  
  
  <!-- Links and Scripts -->  
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="https://cookie-clicker-brasil.vercel.app">
  
  <!-- Favicon -->
  <link rel="shortcut icon" href="https://cookie-clicker-brasil.vercel.app/favicon.ico" type="image/webp">
  <link rel="apple-touch-icon" href="https://cookie-clicker-brasil.vercel.app/favicon.ico">  
  
  <!-- Fonts -->  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=MedievalSharp&display=swap" rel="stylesheet">
  
  <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
  
  <!-- Styles --> 
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet"> 
  
  <!-- Ads -->
  <meta name="google-adsense-account" content="ca-pub-6690516270288705">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6690516270288705" crossorigin="anonymous"></script>  
  
  <script type="module" src="./src/ts/main.ts"></script>
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100">

 <div id="overlay" hidden></div>
 
 <!--- PRIVACY POLICY AND TERMS OF USE NOTICE MESSAGE --->
 <section id='cookie'>
  <div class='content'>
    <p><i18next i18next-id="app.cookie.message"></i18next></p>
    <div class="row mt-2">
      <div class="col">
        <button class="btn w-100 SOUND_EFFECT" id="reject-cookies">
          <i class="fas fa-times-circle"></i> <i18next i18next-id="app.cookie.reject"></i18next>
        </button>
      </div>
      <div class="col">
        <button class="btn w-100 SOUND_EFFECT" id="accept-cookies">
          <i class="fas fa-cookie-bite"></i> <i18next i18next-id="app.cookie.accept"></i18next>
        </button>
      </div>
    </div>
  </div>
 </section>

 <!--- POPUP MESSAGE --->
 <div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="message"></div>
 </div>
 
 <!-- MAIN BACKGROUND MUSIC FOR THE GAME -->
<audio id="MUSIC_SONG" preload="auto" loop>
  <source src="https://cookie-clicker-brasil.vercel.app/sound/music.mp3"
  type="audio/mpeg" />
</audio>

<!-- BEEP SOUND EFFECT FOR QUICK ACTIONS -->
<audio id="EFFECT_SONG" preload="auto">
  <source src="https://cookie-clicker-brasil.vercel.app/sound/beeps.mp3" type="audio/mpeg" />
</audio>

<!-- NOTIFICATION SOUND WHEN A PLAYER JOINS -->
<audio id="JOIN_SONG" preload="auto">
  <source src="https://cookie-clicker-brasil.vercel.app/sound/join.mp3" type="audio/mpeg" />
</audio>

<!-- CLICK SOUND EFFECT FOR UI INTERACTIONS -->
<audio id="CLICK_SONG" preload="auto">
  <source src="https://cookie-clicker-brasil.vercel.app/sound/click.mp3" type="audio/mpeg" />
</audio>

 <!-- SCREEN OF WHEN A NEW UPDATE IS AVAILABLE IN THE ANDROID APPLICATION --->
 <section id="app_update" aria-live="polite" aria-labelledby="app_update_title" hidden>
  <div class="content">
    <a class="icon-link" href="#" aria-label="Download new version">
      <div class="icon"></div>
    </a>
    <h1 id="app_update_title">
      <i18next i18next-id="app.update.title">New version available!</i18next>
    </h1>
    <a class="download SOUND_EFFECT" type="button" aria-label="Download new version">
      <i class="fas fa-download" aria-hidden="true"></i>
      <i18next i18next-id="app.update.download">Download</i18next>
    </a>
  </div>
</section>

 <!--- SPLASH SCREEN --->
 <section id="splash_screen">
    <img class="icon" src="https://cookie-clicker-brasil.vercel.app/favicon.ico" />
  <div class="splash_footer">
    <i18next i18next-id="app.splash_screen.message"><a target='_blank' data-bs-toggle='modal' data-bs-target='#terms_modal'>Terms of Use</a> and <a target='_blank' data-bs-toggle='modal' data-bs-target='#policy_modal'>Privacy Policy</a></i18next>
  </div>
  </section>

 <!--- THE GAME'S START MENU --->
 <section id="home_menu" hidden>
  <h1 class="title">
    <i class="fas fa-cookie-bite"></i>
    <i18next i18next-id="app.menu.title">Cookie</i18next>
  </h1>
  <div class="menu">
    <button id="create_game_room" class="SOUND_EFFECT" data-bs-toggle="modal"
    data-bs-target="#room_modal">
        <i class="fas fa-gamepad"></i>
       <i18next i18next-id="app.menu.button.play">Play</i18next>
    </button>
    <button id="open_settings" class="SOUND_EFFECT" data-bs-toggle="modal" data-bs-target="#settings_modal">
     <i class="fas fa-cog"></i>
     <i18next i18next-id="app.menu.button.settings">Settings</i18next>
   </button> 
  </div>
 </section>

 <div id="countdown-container" class="countdown-overlay justify-content-center
 align-items-center" hidden>
   <h1 id="countdown" class="countdown-text">
     3
   </h1>
 </div>

 <section id="GAMEPLAY" hidden>

   <button id="room_settings_btn" class="btn position-absolute top-0 end-0 m-4 me-4 SOUND_EFFECT">
      <i class="fas fa-cog"></i>
   </button>
    
 <div class="room_code position-fixed top-0 start-50 translate-middle-x mt-4">
  <h3 class="d-flex align-items-center justify-content-center gap-2 position-relative">
    <i class="fas fa-key"></i>
    <i18next i18next-id="app.waiting.code">Room Code:</i18next>
  </h3>
  <p class="d-flex text-center align-items-center justify-content-center gap-2">
    <span id="ROOM_CODE_TEXT">------</span>
    <button id="toggle_code_visibility" class="btn btn-sm p-1 SOUND_EFFECT">
      <i class="fas fa-eye"></i>
    </button>
  </p>
 </div>

  <div class="waiting_room">
    <div class="waiting_room-data">
    <h1>
     <i class="fas fa-cookie-bite"></i>
     <i18next i18next-id="app.waiting.title">Waiting...</i18next>
   </h1>
   <p class="text-center">
     <i class="fas fa-users"></i>
     <x id="PLAYER_ONLINE">1</x>/<x id="PLAYER_MAX">10</x>
   </p>
   <div class="d-flex flex-column justify-content-center align-items-center gap-2">
     <button id="room_create_game" class="btn SOUND_EFFECT w-100" hidden>
       <i class="fas fa-play"></i>
       <i18next i18next-id="app.waiting.button.start">Start</i18next>
     </button>
     <button id="leave_room_game" class="btn SOUND_EFFECT w-100">
       <i class="fas fa-sign-out-alt"></i>
       <i18next i18next-id="app.waiting.button.leave">Leave</i18next>
     </button>
     <button id="chat_room_game" class="btn SOUND_EFFECT w-100">
       <i class="fas fa-comments"></i>
       <i18next i18next-id="app.waiting.button.chat">Chat</i18next>
     </button>
    </div>
   </div>
  </div>

  </section>

  <!-- CARD TO CONFIGURE GAME ROOM --->
 <div class="modal fade" id="room_modal" tabindex="-1" aria-labelledby="room_modalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="room_modalLabel">
                        <i class="fas fa-gamepad"></i>
                        <i18next i18next-id="app.menu.button.settings">Settings</i18next>
                    </h5>
                </div>
                <div class="modal-body">
<form id="form">
  <div class="mb-3">
    <label for="nickname" class="form-label">
      <i class="fas fa-user"></i>
      <i18next i18next-id="app.game.nicknameLabel">Nickname</i18next>
    </label>
    <input type="text" class="form-control" id="room_name" name="nickname" placeholder="Scooby-Doo" required>
  </div>
  
  <div class="mb-3">
    <label class="form-label">
      <i class="fas fa-list-ul"></i>
      <i18next i18next-id="app.game.gameOptionLabel">Choose an option:</i18next>
    </label>
    <div>
      <div class="form-check">
        <input class="form-check-input SOUND_EFFECT" type="radio" name="option_game" id="room_random" value="room_random">
        <label class="form-check-label" for="room_random">
          <i class="fas fa-random"></i>
          <i18next i18next-id="app.game.randomRoom">Join a random room</i18next>
        </label>
      </div>
      
      <div class="form-check">
        <input class="form-check-input SOUND_EFFECT" type="radio" name="option_game" id="createRoom" value="create" checked>
        <label class="form-check-label" for="createRoom">
          <i class="fas fa-plus-circle"></i>
          <i18next i18next-id="app.game.createRoom">Create a room</i18next>
        </label>
      </div>
      
      <div class="form-check">
        <input class="form-check-input SOUND_EFFECT" type="radio" name="option_game" id="room_join" value="join">
        <label class="form-check-label" for="room_join">
          <i class="fas fa-sign-in-alt"></i>
          <i18next i18next-id="app.game.joinRoom">Join a room</i18next>
        </label>
      </div>
    </div>
  </div>
  
  <div class="mb-3" id="code_container" style="display: none;">
    <label for="room_code" class="form-label">
      <i class="fas fa-key"></i>
      <i18next i18next-id="app.game.roomCodeLabel">Room Code</i18next>
    </label>
    <input type="text" class="form-control" id="room_code" name="room_code" placeholder="XN4ZXP" autocomplete="off">
  </div>
  
  <div id="game_container">
    <div class="d-flex gap-2">
      <div class="mb-3 flex-grow-1">
        <label for="room_time" class="form-label d-block">
          <i class="fas fa-clock"></i>
          <i18next i18next-id="app.game.gameTimeLabel">Game Time</i18next>
        </label>
        <input type="number" class="form-control w-100" id="room_time"
        name="gameTime" placeholder="e.g. 10" min="10" max="600" value="11">
      </div>
      <div class="mb-3 flex-grow-1">
        <label for="player_limit" class="form-label d-block">
          <i class="fas fa-users"></i>
          <i18next i18next-id="app.game.gamePlayerLimit">Player Limit</i18next>
        </label>
        <input type="number" class="form-control w-100" id="player_limit" name="playerLimit" placeholder="e.g. 10" min="2" max="50" value="10">
      </div>
    </div>
    
    <div class="mb-3">
      <label for="publicRoom" class="form-label">
        <i class="fas fa-users"></i>
        <i18next i18next-id="app.game.publicRoomLabel">Public Room</i18next>
      </label>
      <input type="checkbox" class="form-check-input me-2 SOUND_EFFECT" id="room_public" name="room_public">
    </div>
  </div>
</form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="close SOUND_EFFECT" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i>
                        <i18next i18next-id="app.modal.close">Close</i18next>
                    </button>
                    <button id="create_room" class="confirm SOUND_EFFECT">
                        <i class="fas fa-check"></i>
                        <i18next i18next-id="app.modal.open">Confirm</i18next>
                    </button>
                </div>
            </div>
        </div>
    </div>

 <!-- CARD TO CONFIGURE GAME  --->
 <div class="modal fade" id="settings_modal" tabindex="-1" aria-labelledby="settings_modalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="settings_modalLabel">
          <i class="fas fa-cog me-2"></i>
          <i18next i18next-id="app.menu.button.settings">Settings</i18next>
        </h5>
      </div>
      <div class="modal-body">
        <div id="settings-form" class="d-flex flex-column gap-2">
          
      <!---    <div class="d-flex justify-content-between align-items-center">
            <div class="mb-2">
              <label for="toggleSound" class="form-label">
                <i class="fas fa-bell"></i>
                <i18next i18next-id="app.settings.notification">Notification</i18next>
              </label>
              <input type="checkbox" class="form-check-input me-2"
              id="toggleNotification" name="toggleNotification">
            </div>
          </div> --->
          
          <div class="d-flex justify-content-between align-items-center">
            <div class="mb-2">
              <label for="toggleSound" class="form-label">
                <i class="fas fa-volume-up"></i>
                <i18next i18next-id="app.settings.sound">Sound</i18next>
              </label>
              <input type="checkbox" class="form-check-input me-2 SOUND_EFFECT" id="toggleSound" name="toggleSound">
            </div>
          </div>
          
          <div class="d-flex justify-content-between align-items-center">
            <div class="mb-2">
              <label for="toggleMusic" class="form-label">
                <i class="fas fa-music"></i>
                <i18next i18next-id="app.settings.music">Background Music</i18next>
              </label>
              <input type="checkbox" class="form-check-input me-2 SOUND_EFFECT" id="toggleMusic" name="toggleMusic">
            </div>
          </div>

         <div class="d-flex justify-content-center my-1">
    <button class="google d-flex align-items-center gap-2 SOUND_EFFECT">
    <i class="fab fa-google"></i>
    <span id="google"><i18next
    i18next-id="app.login.google">Login</i18next></span>
  </button>
   </div>
          
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="close SOUND_EFFECT" data-bs-dismiss="modal">
          <i class="fas fa-times"></i>
          <i18next i18next-id="app.modal.close">Close</i18next>
        </button>
      </div>
    </div>
  </div>
</div>
 
 <!--- CARD TO PRESENT THE TERMS TO USERS FOLLOWING THE CORRECT POLICIES --->
 <div class="modal fade" id="terms_modal" tabindex="-1" aria-labelledby="terms_modalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
   <div class="modal-header">
        <h5 class="modal-title" id="settings_modalLabel">
          <i class="fas fa-file-signature me-2"></i>
          <i18next i18next-id="terms.title">Terms</i18next>
        </h5>
      </div>
   <div class="modal-body">
   <div class="block">
     <p>x</p>
   </div>
   </div>
   <div class="modal-footer">
      <button type="button" class="close" data-bs-dismiss="modal">
   <i class="fas fa-times"></i>
   <i18next i18next-id="modal.cancel">Cancel</i18next>
      </button>
     </div>
    </div>
   </div>
  </div>

 <!-- CARD FOR PLAYERS TO ACCEPT/DECLINE THE PRIVACY POLICIES EMPLOYED BY OUR GAME - POLITICALLY CORRECT!  --->
 <div class="modal fade" id="policy_modal" tabindex="-1" aria-labelledby="policy_modalLabel" aria-hidden="true">
  <div class="modal-dialog">
   <div class="modal-content">
     <div class="modal-header">
       <h5 class="modal-title" id="settings_modalLabel">
          <i class="fas fa-user-secret me-2"></i> <i18next i18next-id="policy.title">Policy</i18next>
        </h5>
      </div>
     <div class="modal-body">
       <div class="block">
        <p>x</p>
       </div>
      </div>
     <div class="modal-footer">
      <button type="button" class="close" data-bs-dismiss="modal">
         <i class="fas fa-times"></i>
         <i18next i18next-id="modal.cancel">Cancel</i18next>
      </button>
    </div>
   </div>
  </div>
 </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/eruda/3.4.1/eruda.min.js" integrity="sha512-3RVqOZtMevFOLeXCp0/Wl7np/l3J3MMysaFDUhNh+hdKx+Wb0lMXuHwA6CZ/+4DfYZM01Om1as8g+mnTaQH9vA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  </script>
 </body>
</html>
